name: Maintien en éveil Supabase

# Supabase met en pause un projet gratuit après 7 jours sans activité : une lecture tous les
# 3 jours suffit à l'éviter. Le job échoue si la base ne répond pas, ce qui déclenche l'e-mail
# d'échec de GitHub.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "apikey: $KEY" \
            "$URL/rest/v1/catalog_versions?select=id&limit=1")
          echo "HTTP $status"
          test "$status" = 200
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
